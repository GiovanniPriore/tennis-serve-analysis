[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-serve-analysis"
version = "0.1.0"
description = "Post-match explanatory regression analysis of ATP serve performance and final game margin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2,<4"]
explain = ["shap>=0.45,<1"]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
